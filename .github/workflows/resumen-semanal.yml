name: Resumen semanal

on:
  schedule:
    - cron: "10 20 * * 5"   # viernes 17:10 hora Argentina; el mail llega alrededor de las 17:30
  workflow_dispatch:
    inputs:
      fecha:
        description: "Viernes a generar (AAAA-MM-DD). Dejar vacío para hoy."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python resumen_semanal.py
        env:
          FECHA_REPORTE: ${{ github.event.inputs.fecha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEED_BASE_URL: ${{ vars.FEED_BASE_URL }}
      - name: Publicar
        run: |
          git config user.name "morning-bot"
          git config user.email "morning-bot@users.noreply.github.com"
          git add docs
          git commit -m "Panel semanal $(date +%F)" || echo "Sin cambios"
          git pull --rebase
          git push
      - name: Enviar mail
        run: python enviar_mail.py
        env:
          GMAIL_USUARIO: ${{ vars.GMAIL_USUARIO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_DESTINATARIOS: ${{ vars.MAIL_DESTINATARIOS }}
          FEED_BASE_URL: ${{ vars.FEED_BASE_URL }}
